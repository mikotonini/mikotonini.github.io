<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --navy:#1A3A5C;--accent:#2196A6;--white:#fff;--bg:#F4F7FA;
  --text:#1E293B;--muted:#64748B;--border:#E2E8F0;
  --cbb:#E6F1FB;--cbt:#0C447C;--ctb:#E1F5EE;--ctt:#0F6E56;
  --cgb:#F1F0E8;--cgt:#5F5E5A;--gnb:#DCFCE7;--gnt:#15803D;
  --amb:#FEF3C7;--amt:#92400E;
}
body{font-family:'Noto Sans JP','Noto Sans',sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.6;min-height:100vh}

/* ── PAGE SHELL ── */
.page{max-width:900px;margin:1.5rem auto;background:var(--white);border-radius:16px;overflow:hidden;box-shadow:0 4px 32px rgba(26,58,92,.10)}

/* ── LANG SWITCHER ── */
.lang-bar{display:flex;justify-content:flex-end;align-items:center;gap:6px;padding:8px 16px;background:#0f2338}
.lang-bar span{font-size:10px;color:#7097BB;letter-spacing:.1em;margin-right:4px}
.lang-btn{font-size:11.5px;font-weight:700;padding:4px 12px;border-radius:20px;border:1.5px solid rgba(202,220,252,.3);background:transparent;color:#9FB8D8;cursor:pointer;transition:all .2s;letter-spacing:.04em}
.lang-btn.active{background:var(--accent);border-color:var(--accent);color:#fff}
.lang-btn:hover:not(.active){background:rgba(255,255,255,.08);color:#CADCFC}

/* ── HEADER ── */
.header{background:var(--navy);padding:1.8rem 2.5rem;display:flex;align-items:center;gap:2rem}
.avatar{width:80px;height:80px;border-radius:50%;background:rgba(255,255,255,.12);border:2px solid rgba(202,220,252,.45);display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:700;color:#fff;flex-shrink:0}
.header-info h1{font-size:24px;font-weight:700;color:#fff;letter-spacing:.04em;margin-bottom:2px}
.header-info .en-name{font-size:14px;color:#CADCFC;margin-bottom:4px}
.header-info .job-title{font-size:11.5px;color:#9FB8D8;font-style:italic;margin-bottom:10px}
.contact-grid{display:flex;flex-wrap:wrap;gap:5px 22px}
.contact-item{display:flex;align-items:center;gap:6px;font-size:11.5px;color:#B0CCE8}
.contact-item svg{width:13px;height:13px;opacity:.7;flex-shrink:0}

/* ── NAV ── */
.nav{display:flex;background:var(--navy);border-top:1px solid rgba(255,255,255,.08)}
.nav-tab{flex:1;padding:.7rem .4rem;text-align:center;font-size:12px;font-weight:700;color:rgba(202,220,252,.6);cursor:pointer;letter-spacing:.05em;border-bottom:3px solid transparent;transition:all .2s;user-select:none}
.nav-tab:hover{color:#CADCFC;background:rgba(255,255,255,.05)}
.nav-tab.active{color:#fff;border-bottom-color:var(--accent)}

/* ── PANELS ── */
.panel{display:none;padding:2rem 2.5rem}
.panel.active{display:block}

/* ── SECTIONS ── */
.section{margin-bottom:1.6rem}
.sec-title{display:flex;align-items:center;gap:9px;margin-bottom:12px;padding-bottom:7px;border-bottom:1px solid var(--border)}
.sec-title .bar{width:4px;height:17px;border-radius:2px;background:var(--accent);flex-shrink:0}
.sec-title span{font-size:10.5px;font-weight:700;color:var(--navy);letter-spacing:.1em;text-transform:uppercase}

/* ── 2-COL ── */
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:2rem}

/* ── INFO TABLE ── */
.info-table{width:100%;border-collapse:collapse}
.info-table td{padding:5px 0;font-size:12.5px;vertical-align:top;border-bottom:1px solid var(--border)}
.info-table .lbl{color:var(--muted);width:120px;font-size:11.5px}

/* ── LANG BARS ── */
.lang-row{display:flex;align-items:center;gap:10px;margin-bottom:9px}
.lang-name{width:56px;font-size:13px;font-weight:500;flex-shrink:0}
.lang-bar-bg{flex:1;height:7px;background:var(--border);border-radius:4px;overflow:hidden}
.lang-fill{height:100%;border-radius:4px;background:var(--navy)}
.lang-tag{font-size:11px;font-weight:700;color:var(--accent);width:76px;text-align:right}

/* ── CERTS ── */
.cert-row{display:flex;gap:12px;padding:5px 0;border-bottom:1px solid var(--border);font-size:12.5px}
.cert-year{color:var(--muted);width:34px;flex-shrink:0}

/* ── CHIPS ── */
.skill-grp{margin-bottom:10px}
.grp-label{font-size:11px;color:var(--muted);font-style:italic;margin-bottom:5px}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{font-size:11px;font-weight:600;padding:3px 10px;border-radius:20px}
.cb{background:var(--cbb);color:var(--cbt)}.ct{background:var(--ctb);color:var(--ctt)}.cg{background:var(--cgb);color:var(--cgt)}

/* ── EDUCATION ── */
.edu-entry{margin-bottom:14px;padding-left:16px;border-left:3px solid var(--border)}
.edu-date{font-size:11px;color:var(--accent);font-weight:600;margin-bottom:1px}
.edu-school{font-size:13px;font-weight:700}
.edu-major{font-size:11.5px;color:var(--muted)}

/* ── JOB ENTRIES ── */
.job-entry{border-left:3px solid var(--accent);padding-left:14px;margin-bottom:22px}
.job-period{font-size:10.5px;font-weight:700;color:var(--accent);margin-bottom:1px}
.job-title{font-size:14px;font-weight:700;margin-bottom:2px}
.job-company{font-size:11.5px;color:var(--muted);font-style:italic;margin-bottom:7px}
.job-bullets{list-style:none;margin-bottom:8px}
.job-bullets li{font-size:12px;color:var(--muted);padding-left:13px;position:relative;margin-bottom:3px}
.job-bullets li::before{content:'–';position:absolute;left:0;color:var(--accent)}
.ach{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;padding:3px 10px;border-radius:5px;margin-bottom:8px}
.ach-green{background:var(--gnb);color:var(--gnt)}
.ach-amber{background:var(--amb);color:var(--amt)}
.job-tags{display:flex;flex-wrap:wrap;gap:4px}
.job-tag{font-size:10.5px;font-weight:600;background:var(--cbb);color:var(--cbt);padding:2px 8px;border-radius:4px}

/* ── TIMELINE ── */
.timeline{padding-left:24px;position:relative}
.timeline::before{content:'';position:absolute;left:5px;top:8px;bottom:0;width:2px;background:var(--border)}
.tl-item{position:relative;margin-bottom:18px}
.tl-item::before{content:'';position:absolute;left:-20px;top:5px;width:10px;height:10px;border-radius:50%;background:var(--accent);border:2px solid #fff;box-shadow:0 0 0 2px var(--accent)}
.tl-date{font-size:10.5px;font-weight:700;color:var(--accent);margin-bottom:1px}
.tl-title{font-size:13px;font-weight:700}
.tl-sub{font-size:11.5px;color:var(--muted)}

/* ── BADGES ── */
.badges{display:flex;flex-wrap:wrap;gap:7px}
.badge{display:inline-flex;align-items:center;gap:5px;background:var(--ctb);color:var(--ctt);font-size:12px;font-weight:700;padding:5px 13px;border-radius:7px}

/* ── PR CARDS ── */
.pr-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.pr-card{border:1px solid var(--border);border-radius:10px;overflow:hidden}
.pr-card-hd{background:var(--navy);color:#fff;font-size:12px;font-weight:700;padding:8px 12px}
.pr-card-bd{padding:12px;font-size:12.5px;line-height:1.75;color:var(--text)}

/* ── FOOTER ── */
footer{background:var(--navy);color:#CADCFC;font-size:11px;text-align:center;padding:10px}

/* ── RESPONSIVE ── */
@media(max-width:680px){
  .two-col,.pr-cards{grid-template-columns:1fr}
  .header{flex-direction:column;align-items:flex-start;gap:1rem;padding:1.5rem}
  .panel{padding:1.2rem 1rem}
  .nav-tab{font-size:11px;padding:.55rem .2rem}
}
@media print{body{background:#fff}.page{box-shadow:none;border-radius:0;margin:0}}
</style>
</head>

// ═══════════════════════════════════════════════════════
// RENDER ENGINE
// ═══════════════════════════════════════════════════════
let currentLang = 'ja';

function h(tag,cls,html){const el=document.createElement(tag);if(cls)el.className=cls;if(html)el.innerHTML=html;return el}
function t(el,txt){document.getElementById(el).textContent=txt}
function i(el,html){document.getElementById(el).innerHTML=html}

function render(lang){
  const D=DATA[lang];
  document.documentElement.lang=lang==='en'?'en':lang==='zh'?'zh-TW':'ja';

  // header
  t('hd-avatar',D.avatar); t('hd-name1',D.name1); t('hd-name2',D.name2); t('hd-title',D.title);
  document.querySelector('#hd-addr span').textContent=D.addr;
  t('footer-text',D.footer);

  // tabs
  D.tabs.forEach((txt,i)=>t('tab-'+['overview','work','education','profile'][i],txt));

  // OVERVIEW ─ info table
  i('ov-info-title',D.info_title);
  i('ov-info-table',D.info.map(([l,v])=>`<tr><td class="lbl">${l}</td><td>${v}</td></tr>`).join(''));

  // lang
  i('ov-lang-title',D.lang_title);
  i('ov-lang-bars',D.langs.map(lg=>`
    <div class="lang-row">
      <span class="lang-name">${lg.n}</span>
      <div class="lang-bar-bg"><div class="lang-fill" style="width:${lg.p}%"></div></div>
      <span class="lang-tag">${lg.l}</span>
    </div>`).join(''));

  // certs
  i('ov-cert-title',D.cert_title);
  i('ov-certs',D.certs.map(([y,n])=>`<div class="cert-row"><span class="cert-year">${y}</span><span>${n}</span></div>`).join(''));

  // skills
  i('ov-skill-title',D.skill_title);
  i('ov-skills',D.skills.map(g=>`
    <div class="skill-grp"><div class="grp-label">${g.label}</div>
    <div class="chips">${g.items.map(it=>`<span class="chip ${g.cls}">${it}</span>`).join('')}</div></div>`).join(''));

  // achievements
  i('ov-ach-title',D.ach_title);
  i('ov-achs',D.achs.map(a=>`<span class="badge">${a}</span>`).join(''));

  // WORK
  i('wk-title',D.wk_title);
  i('wk-jobs',D.jobs.map(job=>`
    <div class="job-entry">
      <div class="job-period">${job.period}</div>
      <div class="job-title">${job.title}</div>
      <div class="job-company">${job.co}</div>
      <ul class="job-bullets">${job.bullets.map(b=>`<li>${b}</li>`).join('')}</ul>
      <div class="ach ${job.amber?'ach-amber':'ach-green'}">▲ ${job.ach}</div>
      <div class="job-tags">${job.tags.map(t=>`<span class="job-tag">${t}</span>`).join('')}</div>
    </div>`).join(''));

  // EDUCATION
  i('ed-title',D.ed_title);
  i('ed-list',D.edu.map(e=>`
    <div class="tl-item">
      <div class="tl-date">${e.date}</div>
      <div class="tl-title">${e.school}</div>
      <div class="tl-sub">${e.major}</div>
    </div>`).join(''));
  i('ed-career-title',D.career_title);
  i('ed-career',D.career.map(c=>`
    <div class="tl-item">
      <div class="tl-date">${c.date}</div>
      <div class="tl-title">${c.title}</div>
      <div class="tl-sub">${c.sub}</div>
    </div>`).join(''));

  // PR
  i('pr-title',D.pr_title);
  i('pr-cards',D.prs.map(p=>`
    <div class="pr-card">
      <div class="pr-card-hd">${p.h}</div>
      <div class="pr-card-bd">${p.b}</div>
    </div>`).join(''));
}

function setLang(lang){
  currentLang=lang;
  document.querySelectorAll('.lang-btn').forEach(b=>b.classList.toggle('active',b.textContent.trim()===(lang==='ja'?'日本語':lang==='en'?'English':'中文')));
  render(lang);
}

// NAV tabs
document.querySelectorAll('.nav-tab').forEach(tab=>{
  tab.addEventListener('click',()=>{
    const target=tab.dataset.tab;
    document.querySelectorAll('.nav-tab').forEach(t=>t.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
    tab.classList.add('active');
    document.getElementById('panel-'+target).classList.add('active');
    window.scrollTo({top:0,behavior:'smooth'});
  });
});

// Init
render('ja');
</script>
